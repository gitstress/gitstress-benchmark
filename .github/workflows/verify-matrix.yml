name: Hardware Concurrency Verification Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Concurrency Headroom
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Benchmark Harness
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Load-Testing Driver
        run: npm install

      - name: Execute 4-Archetype Physical Benchmark Suite
        run: node scripts/run_matrix.js
